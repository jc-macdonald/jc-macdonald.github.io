name: Accessibility audit

on:
  push:
    branches: [main]
    paths:
      - "assets/**"
      - "_data/**"
      - "_includes/**"
      - "_layouts/**"
      - "_pages/**"
      - "_plugins/**"
      - "_projects/**"
      - "_sass/**"
      - "_scripts/**"
      - "_bibliography/**"
      - ".github/scripts/**"
      - ".github/tests/**"
      - ".github/workflows/axe.yml"
      - ".github/workflows/render-cv.yml"
      - "_config.yml"
      - "Gemfile*"
      - "purgecss.config.js"
      - "requirements-rendercv.txt"
  pull_request:
    branches: [main]
    paths:
      - "assets/**"
      - "_data/**"
      - "_includes/**"
      - "_layouts/**"
      - "_pages/**"
      - "_plugins/**"
      - "_projects/**"
      - "_sass/**"
      - "_scripts/**"
      - "_bibliography/**"
      - ".github/scripts/**"
      - ".github/tests/**"
      - ".github/workflows/axe.yml"
      - ".github/workflows/render-cv.yml"
      - "_config.yml"
      - "Gemfile*"
      - "purgecss.config.js"
      - "requirements-rendercv.txt"
  workflow_dispatch:

concurrency:
  group: accessibility-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  render-cv:
    uses: ./.github/workflows/render-cv.yml

  axe:
    needs: render-cv
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.5"
          bundler-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Check semantic and figure color contrast
        run: python .github/tests/test_color_contrast.py -v
      - name: Download the same-revision CV
        uses: actions/download-artifact@v4
        with:
          name: cv-${{ github.sha }}
          path: ${{ runner.temp }}/cv-artifact
      - name: Build the production site
        env:
          JEKYLL_ENV: production
        run: |
          python .github/scripts/render_cv.py verify --output-dir "$RUNNER_TEMP/cv-artifact"
          cp -a "$RUNNER_TEMP/cv-artifact/assets/." assets/
          sudo apt-get update && sudo apt-get install -y imagemagick
          pip install nbconvert
          bundle exec jekyll build
          npm install -g purgecss
          purgecss -c purgecss.config.js
      - name: Match the runner ChromeDriver to Chrome
        run: |
          CHROMIUM_MAJOR=$(google-chrome --product-version | cut -d. -f1)
          echo "CHROMIUM_MAJOR=$CHROMIUM_MAJOR" >> "$GITHUB_ENV"
      - name: Audit representative routes with axe
        env:
          CHROMEDRIVER_PATH: ${{ github.workspace }}/node_modules/.bin/chromedriver
        run: |
          npm install --no-save --no-package-lock axe-core@4.10.2 selenium-webdriver@4.31.0 http-server@14.1.1 chromedriver@"$CHROMIUM_MAJOR"
          ./node_modules/.bin/http-server _site -p 8080 --silent &
          for attempt in {1..20}; do
            curl --fail --silent http://127.0.0.1:8080/ >/dev/null && break
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8080/ >/dev/null
          node .github/scripts/audit_accessibility.mjs \
            http://127.0.0.1:8080 \
            / /reviewer-profile/ /cv/ /publications/ /projects/ \
            /operational-modeling/ /software-examples/ /figures/
