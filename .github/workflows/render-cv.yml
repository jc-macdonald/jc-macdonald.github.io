name: Render a CV

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rendercv:
    name: Validate and preview CV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-rendercv.txt
      - name: Install pinned RenderCV and PDF inspection tool
        run: |
          pip install -r requirements-rendercv.txt
          sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Test valid, invalid and stale publication inputs
        run: python -m unittest discover -s .github/tests -p 'test_render_cv.py' -v
      - name: Render current source into a fresh artifact tree
        run: python .github/scripts/render_cv.py render --output-dir "$RUNNER_TEMP/cv-artifact"
      - name: Check basic PDF semantics
        run: python .github/scripts/verify_cv_pdf.py "$RUNNER_TEMP/cv-artifact/assets/pdf/cv.pdf"
      - name: Upload PDF previews and source provenance
        uses: actions/upload-artifact@v4
        with:
          name: cv-${{ github.sha }}
          path: ${{ runner.temp }}/cv-artifact/
          if-no-files-found: error
          retention-days: 14
