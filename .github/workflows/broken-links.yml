name: Check source and external links

on:
  push:
    branches:
      - master
      - main
    paths:
      - ".github/scripts/**"
      - ".github/tests/**"
      - ".github/lychee.toml"
      - ".github/source-link-pages.txt"
      - "Gemfile*"
      - "assets/**"
      - "_plugins/**"
      - "**.html"
      - "**.js"
      - "**.liquid"
      - "**/*.json"
      - "**/*.md"
      - "**.yml"
      - "!.github/workflows/axe.yml"
      - "!.github/workflows/deploy-docker-tag.yml"
      - "!.github/workflows/deploy-image.yml"
      - "!.github/workflows/docker-slim.yml"
      - "!.github/workflows/lighthouse-badger.yml"
      - "!.github/workflows/prettier.yml"
      - "!lighthouse_results/**"
  pull_request:
    branches:
      - master
      - main
    paths:
      - ".github/scripts/**"
      - ".github/tests/**"
      - ".github/lychee.toml"
      - ".github/source-link-pages.txt"
      - "Gemfile*"
      - "assets/**"
      - "_plugins/**"
      - "**.html"
      - "**.js"
      - "**.liquid"
      - "**/*.json"
      - "**/*.md"
      - "**.yml"
      - "!.github/workflows/axe.yml"
      - "!.github/workflows/deploy-docker-tag.yml"
      - "!.github/workflows/deploy-image.yml"
      - "!.github/workflows/docker-slim.yml"
      - "!.github/workflows/lighthouse-badger.yml"
      - "!.github/workflows/prettier.yml"
      - "!lighthouse_results/**"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  link-checker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.5"
          bundler-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Resolve source Markdown and Liquid
        env:
          JEKYLL_ENV: production
        run: |
          sudo apt-get update && sudo apt-get install -y imagemagick
          pip install nbconvert
          bundle exec jekyll build
          python .github/scripts/check_source_links.py _site "$RUNNER_TEMP/source-links.txt"
      - name: Check maintained external anchors
        uses: lycheeverse/lychee-action@v2.9.0
        with:
          lycheeVersion: v0.24.2
          fail: true
          failIfEmpty: true
          args: --config .github/lychee.toml --no-progress '${{ runner.temp }}/source-links.txt'
      - name: Test broken-link and corrected-link controls
        run: python -m unittest discover -s .github/tests -p 'test_source_links.py' -v
