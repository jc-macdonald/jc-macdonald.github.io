    description: A synthetic matrix reconstructed with VBPCApy and assessed on held-out entries.
    section: incomplete-data
  - name: op_infer_normal_sbc
    title: Analytic posterior and SBC fixture
    description: An exact Normal posterior check and a deliberately underpowered 64-replicate SBC demonstration from public pre-alpha op_infer.
    section: inference-calibration
