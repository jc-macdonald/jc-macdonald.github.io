published_models:
  - name: npzd_hysteresis
    title: Forward hysteresis in an NPZD model
    description: Equilibria of the rescaled nutrient-phytoplankton-zooplankton-detritus (NPZD) model of Macdonald and Gulbudak (2023), recomputed with parameters from the paper, with two simulations in the bistable range that differ only in initial zooplankton and reach different stable states.
published_recomputations:
  - name: fmdv_within_host
    title: Within-host FMDV dynamics by strain
    alt: Four panels recomputed from the published within-host foot-and-mouth disease model, showing viral load and adaptive response by strain and the links to transmission rate and infectious period.
    description: The within-host model of Macdonald et al. (2024) at each strain's median released parameters, with the strain transmission rate against replication rate and per-host infectious period against adaptive activation rate from the released host table.
    width: 720
    height: 605
  - name: covid_lockdown_factor
    title: Lockdown factor and outbreak size
    alt: Two panels on log axes showing the closed-form scaling of final size and peak with the lockdown rate factor, with each jurisdiction's closed form and fatigue-adjusted model outcome.
    description: The closed forms of Macdonald et al. (2021) for final size and peak outbreak size, the closed form at each of the 55 state and territorial jurisdictions' published parameters, and the model solved for 400 days with each jurisdiction's published initial infections and fatigue rate.
    width: 720
    height: 403
illustrations:
  - name: optimal_design
    title: Observation-design tradeoffs
    description: Constructed cost and utility values illustrate dominance and a stated budget.
  - name: structural_fidelity_comparison
    title: Constraint checks for predictions
    description: Two constructed prevalence curves compared with a stated upper bound over the plotted horizon.
model_computations:
  - name: siwr_reservoir_speed
    title: One reproduction number, two transmission routes
    description: Epidemic curves at a fixed reproduction number for three route splits, under a slow and a fast environmental reservoir. Assumed parameters.
  - name: record_type_precision
    title: Growth-rate precision from two kinds of record
    description: Standard error of the growth rate from an environmental signal and from reported counts as the record lengthens. Assumed values, checked by simulation.
  - name: rk4_known_solution
    title: Truncation and round-off against a known solution
    description: Fixed-step Runge-Kutta error against a closed-form solution in float32 and float64, showing the truncation slope and the round-off floor.
stack:
  - name: stack_backend_parity
    title: One compiled model, three array libraries
    alt: Two-panel synthetic chemostat example comparing trajectories with an adaptive reference and showing final errors under NumPy, JAX and PyTorch at two precisions.
    description: A chemostat specification compiled once and integrated under NumPy, JAX and PyTorch in float64 and float32; the error against an adaptive reference agrees to the displayed digits across namespaces at each precision in this recorded run.
    width: 720
    height: 317
  - name: stack_batched_ensemble
    title: A parameter ensemble by vmap
    alt: Two-panel synthetic chemostat ensemble showing a two-parameter grid of final producer values and the median and percentile band over time.
    description: A 45 by 45 grid over two parameters evaluated by one vectorized call to the same compiled evaluator, with the ensemble band over time and a separately computed NumPy run at the nominal parameters.
    width: 720
    height: 317
  - name: stack_gradient
    title: A derivative through the solver
    alt: Two-panel derivative check showing a model output with its local autodiff tangent, and finite-difference disagreement against step size.
    description: A model output differentiated with respect to a parameter by autodiff through 400 fixed Runge-Kutta steps; central finite differences of the same discrete calculation approach the autodiff value with slope 2 before round-off.
    width: 720
    height: 317
  - name: stack_spec_to_ssa
    title: One specification, deterministic and exact stochastic draws
    alt: Two-panel synthetic SIRS example comparing deterministic prevalence with 256 direct-SSA paths and showing mean cumulative event counts.
    description: A susceptible-infectious-recovered model with waning run as an ODE and as 256 direct-SSA paths from one specification with a replicate axis the compiler verifies; population and event-count identities hold exactly on every path.
    width: 720
    height: 331
  - name: stack_spatial_convergence
    title: Spatial convergence to an analytic solution
    alt: Two-panel heat-equation verification comparing a 16-interval finite-difference solution with the analytic solution and showing maximum error over five meshes.
    description: A supplied finite-difference heat operator compiled as a named-axis contraction converges to the closed-form solution with fitted order 2.00 over five meshes.
    width: 720
    height: 317
  - name: stack_steady_states
    title: Equilibria by vectorized steady-state solves
    alt: Cubic-model bifurcation diagram showing two stable branches from vectorized solves, the unstable branch from the polynomial roots, and the interval with two stable states.
    description: Pseudo-transient steady-state solves mapped over 121 parameter values recover both stable branches of a bistable cubic; converged states lie within one millionth of the polynomial roots.
    width: 720
    height: 442
