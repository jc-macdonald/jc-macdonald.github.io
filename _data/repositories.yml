repo_description_lines_max: 2

github_repos:
  - yoavram-lab/VBPCApy
  - jcm-sci/trade-study
  - ACCIDDA/op_engine
  - ACCIDDA/op_system
  - ACCIDDA/flepimop2

repo_descriptions:
  yoavram-lab/VBPCApy: "Variational Bayesian PCA for incomplete data, with approximate posterior covariances, component pruning, and optional C++ kernels."
  jcm-sci/trade-study: "Replicated simulation studies, paired comparisons, Pareto analysis and preference-based decisions with explicit uncertainty and result provenance."
  ACCIDDA/op_engine: "PDE/structured-field and nonlocal operators, deterministic and stochastic reaction solvers, observations and replay with method-specific backend qualification."
  ACCIDDA/op_system: "Specification/compiler for PDE/field, nonlocal and reaction models, with shaped Array API evaluators, operator/observable metadata and forcing contracts."
  ACCIDDA/flepimop2: "Configuration-driven simulation campaigns connecting systems, engines, parameters, processes, jobs and persistence providers."
