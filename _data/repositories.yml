repo_descriptions:
  yoavram-lab/VBPCApy: "Variational Bayesian PCA for incomplete data with full posterior uncertainty, calibrated predictive variance, automatic component pruning, and C++-accelerated kernels."
  jcm-sci/trade-study: "Design and evaluation framework. Score competing configurations against known ground truth via simulators, scoring rules, Pareto optimization, and Bayesian stacking."
  ACCIDDA/op_engine: "Array-API-polymorphic operator-partitioned solver with portable kernels and backend-native execution providers."
  ACCIDDA/op_system: "Restricted model parser and typed-IR compiler for vectorized, Array-API-polymorphic dynamical systems."
  ACCIDDA/flepimop2: "Configuration-driven orchestration engine for CDC-supported infectious disease forecasting and scenario analysis."
