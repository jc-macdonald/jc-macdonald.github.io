repo_description_lines_max: 2

github_repos:
  - yoavram-lab/VBPCApy
  - jcm-sci/trade-study
  - ACCIDDA/op_engine
  - ACCIDDA/op_system
  - ACCIDDA/flepimop2

repo_descriptions:
  yoavram-lab/VBPCApy: "Variational Bayesian PCA for incomplete data with full posterior uncertainty, calibrated predictive variance, automatic component pruning, and C++-accelerated kernels."
  jcm-sci/trade-study: "Replicated simulation studies, paired comparisons, Pareto analysis and preference-based decisions with explicit uncertainty and result provenance."
  ACCIDDA/op_engine: "Framework-independent deterministic and stochastic solvers, independent NumPy SSA banks, observations and replay with qualified CPU backends."
  ACCIDDA/op_system: "Structured model compiler with Array API evaluators, reaction and observable metadata, forcing schedules and independent-block contracts."
  ACCIDDA/flepimop2: "Configuration-driven simulation campaigns connecting systems, engines, parameters, processes, jobs and persistence providers."
