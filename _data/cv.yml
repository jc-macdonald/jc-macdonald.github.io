    Operational Modeling and Policy Support:
      - name: Diphtheria Outbreak-Response Vaccination Modeling
        start_date: 2026
        end_date: present
        summary: "Johns Hopkins IVAC, in collaboration with WHO. Lead modeler for multi-country, district-level transmission analyses comparing outbreak-response vaccination strategies across diverse diphtheria risk settings. Developed to inform evidence review and SAGE deliberations on diphtheria outbreak-response vaccination policy. Implemented with op_system, FlepiMoP2, JAX, and Diffrax."

      - name: COVID-19 Scenario Modeling Hub
        start_date: 2025
        end_date: present
        summary: "ACCIDDA. Led the Round 20 (2026–27) submission, including rebuilding and migrating the legacy model to op_system and FlepiMoP2, model development and calibration, scenario production, quality assurance, and hub submission. Previously contributed data wrangling and data assimilation to the Hub's health-heterogeneities scientific round."
        highlights:
          - "[COVID-19 Scenario Modeling Hub](https://covid19scenariomodelinghub.org/)"
          - "[Submission repository](https://github.com/midas-network/covid19-scenario-modeling-hub)"

      - name: Flu Scenario Modeling Hub
        start_date: 2024
        end_date: present
        summary: "ACCIDDA. Lead Model Developer across the 2024/25, 2025/26, and 2026/27 seasons. Set up the ACCIDDA flu model and operational pipeline (2024/25). Work with external modeling packages informed contributions to FlepiMoP2 (2025/26). Supervising an undergraduate student on revisions to the flu model for the 2026/27 round."
        highlights:
          - "[Submission repository](https://github.com/midas-network/flu-scenario-modeling-hub)"

      - name: Hib Vaccination Modeling (Navajo Nation)
        start_date: 2026
        end_date: present
        summary: "ACCIDDA. Technical supervisor managing PhD students in implementation of an age- and immune-status-structured Haemophilus influenzae type b (Hib) model for the Navajo Nation to evaluate the impact of long-running vaccination programs."

    "Research Software -- Lead Developer":
      - name: "OP System (Operator-Partitioned System)"
        start_date: 2026
        end_date: present
        summary: "Turns readable model descriptions into calculations for simulation and data analysis. Handles spatial structure, interactions between groups and random events in disease, ecological and other dynamical models. Public alpha release."
        highlights:
          - "[Source](https://github.com/ACCIDDA/op_system)"

      - name: pp-eigentest
        start_date: 2026
        end_date: present
        summary: "Research on distinguishing underlying patterns from noise in incomplete data. Revises a 2024 preprint and studies how missing observations and modeling assumptions affect that choice. Private alpha software; evaluation studies and manuscript revision are in progress."
        highlights:
          - "[Project summary](https://jcmacdonald.dev/projects/pp_eigentest/)"

      - name: "op_infer (Inference and Calibration)"
        start_date: 2026
        end_date: present
        summary: "Connects scientific models with data to estimate unknown quantities and compare data-collection plans. Tests fitting procedures on simulated data under stated modeling assumptions. Private pre-alpha research software; broader interfaces and application studies remain in development."
        highlights:
          - "[Project summary](https://jcmacdonald.dev/projects/inference_calibration/)"

      - name: "Trade Study (Python)"
        start_date: 2026
        end_date: present
        summary: "Compares model settings, experiments and surveillance plans using repeated simulations. Helps researchers assess uncertainty and weigh competing goals such as accuracy, information and cost. Public alpha release."
        highlights:
          - "[Source](https://github.com/jcm-sci/trade-study) · [PyPI](https://pypi.org/project/trade-study/) · [Archived release](https://doi.org/10.5281/zenodo.19599838)"

      - name: "OP Engine (Operator-Partitioned Engine)"
        start_date: 2025
        end_date: present
        summary: "Simulates models that change over time and space, including systems with random events. Supports repeated simulations and summaries of quantities such as population counts. Public alpha release; capabilities and numerical checks depend on the selected method."
        highlights:
          - "[Source](https://github.com/ACCIDDA/op_engine)"

      - name: vbpca-py
        start_date: 2024
        end_date: present
        summary: "Finds patterns in incomplete datasets without first filling in every missing observation. Produces low-dimensional summaries and estimates uncertainty using a Bayesian approximation. Public beta release, with tools for checking fit and choosing the number of summary dimensions."
        highlights:
          - "[PyPI](https://pypi.org/project/vbpca-py/) · [Archived release](https://doi.org/10.5281/zenodo.19389250)"

    "Research Software -- Collaborative Infrastructure":
      - name: "FlepiMoP2 (Flexible Pipeline for Interchangeable Model Processing)"
        start_date: 2025
        end_date: present
        summary: "ACCIDDA. Coordinates simulation campaigns across locations and scenarios. Core contributor to its model, simulation and data-storage interfaces; led migration of ACCIDDA's COVID-19 model for the Round 20 Scenario Modeling Hub submission. Public alpha release."
        highlights:
          - "[Documentation](https://accidda.github.io/flepimop2/latest/)"

      - name: TabularEpi
        date: 2025
        summary: "UNC / ACCIDDA. Tabular epidemic simulator supporting mixed deterministic-stochastic models. Conducted systematic performance benchmarking that identified bottlenecks, informing the design of the next-generation pipeline."

      - name: "FlepiMoP (Flexible Epidemic Modeling Pipeline)"
        start_date: 2024
        end_date: 2025
        summary: "Hopkins IDD / ACCIDDA. Developed simulation and statistical inference components for operational influenza modeling. Performance profiling and vectorized backend work informed subsequent pipeline development."

    "Research Support -- Active":
      - name: "USDA-NIFA AFRI US--UK Collaboration (Award #1032897)"
        start_date: 2025
        end_date: 2028
        summary: "**Collaborator.** Model parameterization, data analysis, and advice on mathematical and statistical methods. Quiescence to emergence: Does nairovirus diversity loss increase disease transmission, severity and the risk of emergence? US PIs: Brianna Beechler, Anna Jolles, Cameron Browne, and Hayriye Gulbudak; linked UKRI award BB/Z516934/1 with Emma Thomson, Teresa Lambe, Roman Biek, and Georgina Limon-Vega."

      - name: "USDA-ARS Cooperative Agreement (3022-32000-021-018-S)"
        start_date: 2025
        end_date: present
        summary: "**Collaborator.** Models of transmission between species, surveillance design, and statistical advice. Investigating the Epidemiology of Crimean-Congo Hemorrhagic Fever Virus (CCHFV) in an Endemic Setting: Uganda. PIs: Bree Beechler and Anna Jolles (Oregon State University)."

      - name: "CDC-RFA-FT-23-0069 (NU38FT000012)"
        start_date: 2023
        end_date: present
        summary: "**Operational modeling, forecasting pipelines, and computational infrastructure.** Atlantic Coast Center for Infectious Disease Dynamics and Analytics (ACCIDDA), an Insight Net center. Directors: Justin Lessler, Kimberly Powers, and Shaun Truelove."

      - name: "NSF EEID / UKRI UK--US Collaboration Grant"
        start_date: 2022
        end_date: 2027
        summary: "**Senior Personnel (from 2024).** Model development and parameterization of within-host viral and immune dynamics. Multi-scale infection dynamics from cells to landscapes: FMD in African buffalo. Total project budget: $4.05M over five years. PIs: Brianna Beechler, Roman Biek, Hayriye Gulbudak, Erin Gorsich, Simon Gubbins, Anna Jolles, and Jan Medlock."

    "Research Support -- Completed":
      - name: "Zuckerman Postdoctoral Scholarship"
        start_date: 2022
