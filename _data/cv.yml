        summary: "**Principal Investigator.** Co-evolution of Cultural and Genetic Traits. Competitive postdoctoral fellowship; authored and defended the proposal. Total fellowship award: $120K."

    "Research Support -- Pending":
      - name: "National One Health Mission India"
        summary: "**Proposed Co-Investigator.** Full proposal stage after initial review; full proposal being submitted. Development of an Integrated One Health Disease Modelling and Digital Health Program in Human, Livestock, and Wildlife. Proposed role: model parameterization and data analysis for highly pathogenic avian influenza and anthrax in India; stakeholder training; and supervision of postdoctoral and doctoral trainees. Proposed total project budget: $1M over three years."

    Computational Expertise:
      - label: Modeling
        details: "Mathematical and computational models of changing systems, including spatial, stochastic, compartmental and agent-based models; machine learning with scientific constraints; multivariate data analysis and dimensionality reduction; stability, bifurcation and sensitivity analysis; parameter identifiability and inverse problems"

      - label: Inference
        details: "Bayesian hierarchical models; variational and simulation-based inference; data assimilation; uncertainty quantification; model calibration and validation; proper scoring rules and forecast evaluation"

      - label: Computing
        details: "Python, Julia, C++, Stan, R, MATLAB. Scientific computing; high-performance numerical solvers; operator splitting; data pipelines and exploratory analysis; reproducible workflows (Git, CI/CD, containerization)"

